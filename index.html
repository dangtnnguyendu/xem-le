<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Học Tiếng Pháp">
  <title>Học Tiếng Pháp Qua Video - Song Ngữ</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 14px 48px;
      background: #121212;
      color: #eee;
    }
    .panel {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 10px;
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 14px;
      border: 1px solid #2c2c2c;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-yellow { background: #ffeb3b; color: #111; }
    .btn-purple { background: #9c27b0; color: #fff; }
    .btn-blue { background: #2196f3; color: #fff; }
    .btn-teal { background: #00897b; color: #fff; }
    .btn-green { background: #4caf50; color: #fff; }
    .btn-red { background: #d32f2f; color: #fff; }
    .btn-gray { background: #383838; color: #eee; }
    .btn-off { background: #242424; color: #777; border: 1px solid #383838; }
    .btn-unpinned { background: #333; color: #ffd54f; border: 1px solid #555; }
    .btn-pinned { background: #ff9800; color: #111; border: 1px solid #ffb74d; }

    details {
      background: #161616;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2b2b2b;
      font-size: 13px;
    }
    summary { cursor: pointer; color: #80deea; font-weight: 600; user-select: none; }
    .db-grid { display: grid; gap: 10px; margin-top: 10px; }

    /* Khung phát video & chế độ toàn màn hình đẩy video sát mép trên, dồn toàn bộ dải đen xuống dưới */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .video-wrapper.pseudo-fs,
    .video-wrapper:fullscreen,
    .video-wrapper:-webkit-full-screen {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 99999;
      border-radius: 0;
      background: #000;
      display: flex !important;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    video, #ytPlayer { width: 100%; height: 100%; display: block; }

    /* Trong toàn màn hình: giữ khung video đúng tỷ lệ 16:9 sát mép trên, dồn toàn bộ viền đen xuống dưới */
    .video-wrapper.pseudo-fs video,
    .video-wrapper:fullscreen video,
    .video-wrapper:-webkit-full-screen video,
    .video-wrapper.pseudo-fs #ytPlayer,
    .video-wrapper:fullscreen #ytPlayer,
    .video-wrapper:-webkit-full-screen #ytPlayer {
      width: 100% !important;
      max-width: calc(100vh * 16 / 9);
      max-width: calc(100dvh * 16 / 9);
      height: auto !important;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
    }

    /* Ngăn iframe YouTube / video cướp cảm ứng khi đang kéo thả phụ đề */
    .video-wrapper.dragging-sub #ytPlayer,
    .video-wrapper.dragging-sub video {
      pointer-events: none !important;
    }

    /* Nhãn tên nhân vật */
    .speaker-badge {
      display: inline-block;
      background: rgba(255, 152, 0, 0.22);
      color: #ffcc80;
      border: 1px solid rgba(255, 183, 77, 0.35);
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-bottom: 3px;
      letter-spacing: 0.3px;
    }
    .subtitle-overlay.mode-horizontal .speaker-badge {
      display: block;
      width: fit-content;
      margin: 0 auto 3px;
    }
    .v-speaker {
      display: inline-block;
      color: #ffcc80;
      font-size: 9.5px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* Hiệu ứng Karaoke: Mặc định trắng, đoạn đang nói bôi vàng cho cả Pháp & Việt */
    .k-seg {
      color: #ffffff;
      transition: color 0.1s ease;
    }
    .k-seg.active {
      color: #ffeb3b;
    }

    /* --- CHẾ ĐỘ PHỤ ĐỀ 1: NẰM NGANG (NỀN ĐEN TRONG SUỐT, KÉO THẢ DI ĐỘNG TỰ DO) --- */
    .subtitle-overlay.mode-horizontal {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 94%;
      text-align: center;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      z-index: 20;
    }
    /* Trong toàn màn hình: mặc định đặt phụ đề ngang nằm gọn trong viền đen bên dưới để không che video */
    .video-wrapper.pseudo-fs .subtitle-overlay.mode-horizontal,
    .video-wrapper:fullscreen .subtitle-overlay.mode-horizontal,
    .video-wrapper:-webkit-full-screen .subtitle-overlay.mode-horizontal {
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      max-width: 95%;
    }
    .subtitle-overlay.mode-horizontal:active {
      cursor: grabbing;
    }
    .subtitle-overlay.mode-horizontal .subtitle-box {
      display: inline-block;
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 14px;
      border-radius: 8px;
      line-height: 1.38;
      max-width: 100%;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.85);
    }
    .subtitle-overlay.mode-horizontal .subtitle-box:empty { display: none; }
    .sub-fr { color: #ffffff; font-size: 16.5px; font-weight: 600; }
    .sub-vi { color: #ffffff; font-size: 14.5px; font-weight: 500; margin-top: 3px; }

    .video-wrapper.pseudo-fs .mode-horizontal .sub-fr,
    .video-wrapper:fullscreen .mode-horizontal .sub-fr,
    .video-wrapper:-webkit-full-screen .mode-horizontal .sub-fr { font-size: 21px; }
    .video-wrapper.pseudo-fs .mode-horizontal .sub-vi,
    .video-wrapper:fullscreen .mode-horizontal .sub-vi,
    .video-wrapper:-webkit-full-screen .mode-horizontal .sub-vi { font-size: 18px; }

    /* --- CHẾ ĐỘ PHỤ ĐỀ 2: NẰM DỌC (NỀN ĐEN TRONG SUỐT, CÓ THANH KÉO THẢ DI ĐỘNG) --- */
    .subtitle-overlay.mode-vertical {
      position: absolute;
      top: 8px;
      right: 8px;
      height: calc(100% - 54px);
      width: 17%;
      min-width: 135px;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
      z-index: 20;
      text-align: left;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
    }
    .subtitle-overlay.mode-vertical:empty { display: none; }

    .v-drag-handle {
      flex-shrink: 0;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      font-size: 9.5px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.4px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .v-drag-handle:active {
      cursor: grabbing;
      color: #ffeb3b;
    }

    .v-sub-list {
      flex: 1;
      padding: 5px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Khi phóng toàn màn hình: chiếm 12.5% chiều rộng bên phải */
    .video-wrapper.pseudo-fs .subtitle-overlay.mode-vertical,
    .video-wrapper:fullscreen .subtitle-overlay.mode-vertical,
    .video-wrapper:-webkit-full-screen .subtitle-overlay.mode-vertical {
      width: 12.5%;
      min-width: 120px;
      height: calc(100% - 28px);
    }

    .v-sub-item {
      padding: 4px 5px;
      margin-bottom: 4px;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0.72;
      border-left: 2px solid transparent;
      transition: background 0.15s, opacity 0.15s;
    }
    .v-sub-item:active { background: rgba(255, 255, 255, 0.12); }
    .v-sub-item.active {
      opacity: 1;
      background: rgba(255, 235, 59, 0.14);
      border-left: 2px solid rgba(255, 235, 59, 0.85);
    }
    .v-time {
      display: block;
      font-size: 8.5px;
      font-family: monospace;
      color: #bdbdbd;
      margin-bottom: 2px;
    }
    .v-fr {
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.3;
      word-break: break-word;
    }
    .v-vi {
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 400;
      line-height: 1.28;
      margin-top: 2px;
      word-break: break-word;
    }
    .video-wrapper.pseudo-fs .v-fr,
    .video-wrapper:fullscreen .v-fr,
    .video-wrapper:-webkit-full-screen .v-fr { font-size: 11.5px; }
    .video-wrapper.pseudo-fs .v-vi,
    .video-wrapper:fullscreen .v-vi,
    .video-wrapper:-webkit-full-screen .v-vi { font-size: 10.5px; }

    /* Dời 2 nút nổi xuống dưới thanh tiêu đề/chia sẻ YouTube (top: 56px) và tránh xa nút CC ở đáy */
    .floating-controls {
      position: absolute;
      top: 56px;
      right: 12px;
      bottom: auto;
      z-index: 25;
      display: flex;
      gap: 6px;
      transition: right 0.2s;
    }
    /* Đẩy cụm nút nổi sang trái cột phụ đề dọc mặc định để không đè lên chữ */
    .video-wrapper.has-vertical-sub .floating-controls {
      right: calc(17% + 16px);
    }
    .video-wrapper.pseudo-fs.has-vertical-sub .floating-controls,
    .video-wrapper:fullscreen.has-vertical-sub .floating-controls,
    .video-wrapper:-webkit-full-screen.has-vertical-sub .floating-controls {
      right: calc(12.5% + 18px);
    }
    .floating-btn {
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .transcript-box {
      margin-top: 14px;
      max-height: 290px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #2c2c2c;
    }
    .line {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      font-size: 15px;
      border-bottom: 1px solid #262626;
    }
    .line:active, .line:hover { background: #2a2a2a; }
    .line.active { background: #332b00; }
    .line-fr { color: #ffffff; }
    .line.active .line-fr { font-weight: 600; }
    .time { color: #888; min-width: 48px; font-family: monospace; padding-top: 2px; font-size: 13px; }
    .line-vi { color: #ffffff; font-size: 14px; margin-top: 4px; opacity: 0.92; }
    .line.active .line-vi { opacity: 1; }

    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    @media (max-width: 720px) { .ai-grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%;
      height: 135px;
      background: #141414;
      color: #dcdcdc;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
    }
    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
    }
    #status { color: #4caf50; font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- BẢNG ĐIỀU KHIỂN CHÍNH -->
  <div class="panel">
    <div class="row">
      <select id="videoSelect"><option value="">-- Đang mở kho dữ liệu trên iPad... --</option></select>
      <button type="button" class="btn-unpinned" id="pinBtn" title="Ghim video này để lần sau mở web vẫn giữ nguyên">📌 Ghim</button>
      <button type="button" class="btn-purple" id="randomBtn">🎲 Random</button>
      <button type="button" class="btn-green" id="confirmWatchedBtn">✓ Xác nhận đã xem</button>
    </div>

    <div class="row">
      <button type="button" class="btn-blue" id="toggleFrBtn">🇫🇷 Pháp: BẬT</button>
      <button type="button" class="btn-blue" id="toggleViBtn">🇻🇳 Việt: BẬT</button>
      <button type="button" class="btn-teal" id="toggleLayoutBtn">📐 Kiểu PĐ: Ngang</button>
      <button type="button" class="btn-yellow" id="toggleFsBtn">⛶ Toàn màn hình</button>
    </div>

    <div id="status">Đang kiểm tra dữ liệu lưu trong IndexedDB...</div>

    <!-- QUẢN LÝ KHO DỮ LIỆU DUY NHẤT (INDEXEDDB) -->
    <details id="dataManagerBox">
      <summary>💾 Kho dữ liệu trên iPad (Nạp 1 lần / Xuất sao lưu / Khôi phục)</summary>
      <div class="db-grid">
        <div class="row">
          <label>📥 <b>Nạp file dữ liệu duy nhất</b> (<code>du_lieu_tong_hop.json</code>):
            <input type="file" id="unifiedFileInput" accept=".json,application/json">
          </label>
        </div>
        <div class="row">
          <button type="button" class="btn-blue" id="exportUnifiedBtn">📤 Xuất 1 file JSON mới nhất</button>
          <button type="button" class="btn-gray" id="resetHistoryBtn">↺ Khôi phục lịch sử đã xem</button>
          <button type="button" class="btn-red" id="clearDbBtn">🗑️ Xóa sạch bộ nhớ web</button>
        </div>
        <div class="row" style="border-top: 1px solid #2b2b2b; padding-top: 8px;">
          <label>Hoặc chọn phát file <b>.mp4</b> offline trên iPad:
            <input type="file" id="localVideoInput" accept="video/*">
          </label>
        </div>
      </div>
    </details>
  </div>

  <!-- KHUNG PHÁT VIDEO -->
  <div class="video-wrapper" id="videoWrapper">
    <div class="floating-controls">
      <button type="button" class="floating-btn" id="floatingLayoutBtn">📐 PĐ: Ngang</button>
      <button type="button" class="floating-btn" id="floatingFsBtn">⛶ Toàn màn hình</button>
    </div>
    <video id="html5Video" controls playsinline webkit-playsinline></video>
    <div id="ytPlayer" style="display:none;"></div>
    <div id="subtitleOverlay" class="subtitle-overlay mode-horizontal">
      <div id="subtitleBox" class="subtitle-box"></div>
    </div>
  </div>

  <!-- DỊCH PHỤ ĐỀ QUA AI TRỰC TIẾP TRÊN IPAD -->
  <div class="ai-grid">
    <div class="panel" style="margin-bottom:0;">
      <div class="box-header">
        <span>1. Prompt + Phụ đề gốc (Gửi AI)</span>
        <button type="button" class="btn-blue" id="copyRawBtn">📋 Copy trọn bộ</button>
      </div>
      <textarea id="exportBox" readonly placeholder="Chọn video để tự động tạo Prompt..."></textarea>
    </div>

    <div class="panel" style="margin-bottom:0;">
      <div class="box-header">
        <span>2. Dán JSON từ AI vào đây</span>
        <button type="button" class="btn-green" id="saveSubBtn">💾 Lưu vào iPad</button>
      </div>
      <textarea id="importBox" placeholder='Dán mảng JSON [{"from_i": 0, "to_i": 1, "speaker": "...", "fr": "...", "vi": "..."}] từ AI vào đây rồi bấm Lưu...'></textarea>
    </div>
  </div>

  <!-- DANH SÁCH CÂU THOẠI -->
  <div class="transcript-box" id="transcriptBox"></div>

  <script>
    const AI_PROMPT = `Bạn là chuyên gia biên tập và dịch thuật phụ đề song ngữ Pháp - Việt cho video truyện tranh hội thoại.
Dưới đây là thông tin video (link, tiêu đề) và mảng JSON chứa bản chép lời tiếng Pháp tự động (ASR) kèm mốc thời gian.

NHIỆM VỤ CỦA BẠN:
1. Gộp câu theo từng lượt nói / suy nghĩ của nhân vật:
  - Gộp các mảnh ASR liên tiếp thuộc cùng một nhân vật thành một đoạn hoàn chỉnh.
  - Nếu một dòng ASR bị dính lời của 2 nhân vật khác nhau (hoặc dính lời thoại và lời dẫn chuyện), hãy tách thành 2 phần tử riêng biệt và dùng chung chỉ số "from_i" / "to_i" tại điểm giao nhau.
  - Nếu một nhân vật nói hoặc độc thoại quá dài (trên 3 câu), hãy ngắt thành các đoạn ngắn tự nhiên (1-3 câu/đoạn) để dễ đọc trên màn hình.
2. Xác định người nói ("speaker"):
  - Ghi rõ tên nhân vật đang nói hoặc "(Suy nghĩ)" cho lời dẫn chuyện nội tâm (ví dụ: "Kento", "Kento (Suy nghĩ)", "Inamori", "Hội trưởng", "Nhạc"...).
3. Đánh bóng tiếng Pháp ("fr") & Dịch tiếng Việt ("vi"):
  - Sửa lỗi chính tả ASR, thêm dấu câu chuẩn ngữ pháp tiếng Pháp.
  - Dịch sang tiếng Việt tự nhiên, đúng xưng hô theo vai vế nhân vật. Không dùng dấu ngoặc kép (") bên trong chuỗi dịch, thay bằng « ».

ĐỊNH DẠNG ĐẦU RA BẮT BUỘC (Chỉ trả về duy nhất 1 khối JSON hợp lệ):
[
  {"from_i": 0, "to_i": 1, "speaker": "Tên nhân vật", "fr": "Đoạn tiếng Pháp hoàn chỉnh.", "vi": "Đoạn dịch tiếng Việt tương ứng."}
]

DỮ LIỆU VIDEO VÀ PHỤ ĐỀ THÔ CẦN XỬ LÝ:`;

    // --- KHO LƯU TRỮ INDEXEDDB CHO SAFARI IPAD ---
    const DB_NAME = 'YtFrenchLearningDB';
    const STORE_NAME = 'mainStore';
    const DB_KEY = 'unified_dataset';
    const LAYOUT_PREF_KEY = 'yt_fr_sub_layout_mode';
    const PINNED_VIDEO_KEY = 'yt_fr_pinned_video_id';
    const SUB_POS_PREF_KEY = 'yt_fr_custom_sub_pos_v1';

    function loadSavedSubPos() {
      try {
        const raw = localStorage.getItem(SUB_POS_PREF_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            horizontal: parsed.horizontal || null,
            horizontalFs: parsed.horizontalFs || null,
            vertical: parsed.vertical || null
          };
        }
      } catch {}
      return { horizontal: null, horizontalFs: null, vertical: null };
    }

    let customSubPos = loadSavedSubPos();

    let dbState = {
      updated_at: '',
      pinned_id: '',
      custom_sub_pos: customSubPos,
      skipped_ids: [],
      watched_ids: [],
      videos: []
    };
    let videoMap = {};
    let watchedSet = new Set();

    let currentVideoId = '';
    let currentTranscript = [];
    let activeIndex = -1;
    let activeSubIndex = -1;
    let ytPlayer = null;
    let isUsingYouTube = false;
    let showFr = true;
    let showVi = true;
    let subLayout = localStorage.getItem(LAYOUT_PREF_KEY) || 'horizontal'; // 'horizontal' | 'vertical'

    const videoWrapper = document.getElementById('videoWrapper');
    const html5Video = document.getElementById('html5Video');
    const ytDiv = document.getElementById('ytPlayer');
    const videoSelect = document.getElementById('videoSelect');
    const pinBtn = document.getElementById('pinBtn');
    const subtitleOverlay = document.getElementById('subtitleOverlay');
    const transcriptBox = document.getElementById('transcriptBox');
    const exportBox = document.getElementById('exportBox');
    const importBox = document.getElementById('importBox');
    const statusEl = document.getElementById('status');
    const confirmWatchedBtn = document.getElementById('confirmWatchedBtn');
    const toggleLayoutBtn = document.getElementById('toggleLayoutBtn');
    const floatingLayoutBtn = document.getElementById('floatingLayoutBtn');

    function isVideoFullscreen() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        videoWrapper.classList.contains('pseudo-fs')
      );
    }

    function getCurrentPosKey() {
      if (subLayout === 'vertical') return 'vertical';
      return isVideoFullscreen() ? 'horizontalFs' : 'horizontal';
    }

    function persistSubPos() {
      try {
        localStorage.setItem(SUB_POS_PREF_KEY, JSON.stringify(customSubPos));
      } catch {}
      dbState.custom_sub_pos = customSubPos;
    }

    // --- KÉO THẢ DI ĐỘNG KHUNG PHỤ ĐỀ (CẢ CẢM ỨNG IPAD & CHUỘT) ---
    let dragState = null;
    let lastTapTime = 0;

    function resetOverlayInlinePosition() {
      subtitleOverlay.style.left = '';
      subtitleOverlay.style.top = '';
      subtitleOverlay.style.right = '';
      subtitleOverlay.style.bottom = '';
      subtitleOverlay.style.transform = '';
    }

    function applySavedOverlayPosition() {
      const posKey = getCurrentPosKey();
      const pos = customSubPos[posKey];
      if (!pos) {
        resetOverlayInlinePosition();
        if (subLayout === 'vertical') {
          videoWrapper.classList.add('has-vertical-sub');
        }
        return;
      }

      const wrapRect = videoWrapper.getBoundingClientRect();
      const ovRect = subtitleOverlay.getBoundingClientRect();
      if (!wrapRect.width || !wrapRect.height) return;

      const maxLeft = Math.max(4, wrapRect.width - ovRect.width - 4);
      const maxTop = Math.max(4, wrapRect.height - ovRect.height - 4);
      const clampedLeft = Math.min(maxLeft, Math.max(4, pos.leftRatio * wrapRect.width));
      const clampedTop = Math.min(maxTop, Math.max(4, pos.topRatio * wrapRect.height));

      subtitleOverlay.style.left = clampedLeft + 'px';
      subtitleOverlay.style.top = clampedTop + 'px';
      subtitleOverlay.style.right = 'auto';
      subtitleOverlay.style.bottom = 'auto';
      subtitleOverlay.style.transform = 'none';

      if (subLayout === 'vertical') {
        videoWrapper.classList.remove('has-vertical-sub');
      }
    }

    function clampOverlayInBounds() {
      applySavedOverlayPosition();
    }

    function getClientPoint(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      if (e.changedTouches && e.changedTouches.length > 0) {
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startSubDrag(e) {
      if (subLayout === 'horizontal') {
        if (!e.target.closest('#subtitleOverlay')) return;
      } else {
        if (!e.target.closest('.v-drag-handle')) return;
      }

      // Chạm đúp (double-tap / double-click) để đưa phụ đề về vị trí mặc định (nằm gọn trong viền đen dưới khi toàn màn hình)
      const now = Date.now();
      if (now - lastTapTime < 300) {
        lastTapTime = 0;
        customSubPos[getCurrentPosKey()] = null;
        persistSubPos();
        applySavedOverlayPosition();
        e.preventDefault();
        return;
      }
      lastTapTime = now;

      const pt = getClientPoint(e);
      const wrapRect = videoWrapper.getBoundingClientRect();
      const ovRect = subtitleOverlay.getBoundingClientRect();

      dragState = {
        startX: pt.x,
        startY: pt.y,
        origLeft: ovRect.left - wrapRect.left,
        origTop: ovRect.top - wrapRect.top,
        moved: false
      };

      videoWrapper.classList.add('dragging-sub');
      if (e.cancelable) e.preventDefault();
    }

    function onSubDragMove(e) {
      if (!dragState) return;
      const pt = getClientPoint(e);
      const dx = pt.x - dragState.startX;
      const dy = pt.y - dragState.startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;

      const wrapRect = videoWrapper.getBoundingClientRect();
      const ovRect = subtitleOverlay.getBoundingClientRect();
      const maxLeft = Math.max(4, wrapRect.width - ovRect.width - 4);
      const maxTop = Math.max(4, wrapRect.height - ovRect.height - 4);

      const newLeft = Math.min(maxLeft, Math.max(4, dragState.origLeft + dx));
      const newTop = Math.min(maxTop, Math.max(4, dragState.origTop + dy));

      subtitleOverlay.style.left = newLeft + 'px';
      subtitleOverlay.style.top = newTop + 'px';
      subtitleOverlay.style.right = 'auto';
      subtitleOverlay.style.bottom = 'auto';
      subtitleOverlay.style.transform = 'none';

      if (subLayout === 'vertical') {
        videoWrapper.classList.remove('has-vertical-sub');
      }

      if (wrapRect.width > 0 && wrapRect.height > 0) {
        customSubPos[getCurrentPosKey()] = {
          leftRatio: newLeft / wrapRect.width,
          topRatio: newTop / wrapRect.height
        };
      }

      if (e.cancelable) e.preventDefault();
    }

    function endSubDrag() {
      if (!dragState) return;
      const wasMoved = dragState.moved;
      dragState = null;
      videoWrapper.classList.remove('dragging-sub');
      if (wasMoved) {
        persistSubPos();
      }
    }

    subtitleOverlay.addEventListener('touchstart', startSubDrag, { passive: false });
    subtitleOverlay.addEventListener('mousedown', startSubDrag);
    window.addEventListener('touchmove', onSubDragMove, { passive: false });
    window.addEventListener('mousemove', onSubDragMove);
    window.addEventListener('touchend', endSubDrag);
    window.addEventListener('touchcancel', endSubDrag);
    window.addEventListener('mouseup', endSubDrag);
    window.addEventListener('resize', clampOverlayInBounds);

    function getPinnedVideoId() {
      return localStorage.getItem(PINNED_VIDEO_KEY) || dbState.pinned_id || '';
    }

      } else {

      }

      updatePinButtonUI();

    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveToIDB() {
      dbState.updated_at = new Date().toISOString();
      dbState.pinned_id = getPinnedVideoId();
      dbState.custom_sub_pos = customSubPos;
      dbState.watched_ids = [...watchedSet];
      dbState.videos = Object.values(videoMap);
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(dbState, DB_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadFromIDB() {
      const db = await openIDB();
      return new Promise((resolve) => {
        const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(DB_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

    function hydrateState(raw) {
      const localPin = localStorage.getItem(PINNED_VIDEO_KEY) || '';
      const resolvedPin = localPin || raw?.pinned_id || '';
      if (resolvedPin) {
        localStorage.setItem(PINNED_VIDEO_KEY, resolvedPin);
      }

      if (raw?.custom_sub_pos && !localStorage.getItem(SUB_POS_PREF_KEY)) {
        customSubPos = {
          horizontal: raw.custom_sub_pos.horizontal || null,
          horizontalFs: raw.custom_sub_pos.horizontalFs || null,
          vertical: raw.custom_sub_pos.vertical || null
        };
        persistSubPos();
      }

      dbState = {
        updated_at: raw?.updated_at || '',
        pinned_id: resolvedPin,
        custom_sub_pos: customSubPos,
        skipped_ids: Array.isArray(raw?.skipped_ids) ? raw.skipped_ids : [],
        watched_ids: Array.isArray(raw?.watched_ids) ? raw.watched_ids : [],
        videos: []
      };
      watchedSet = new Set(dbState.watched_ids);
      videoMap = {};

      const list = Array.isArray(raw?.videos) ? raw.videos : (Array.isArray(raw) ? raw : []);
      list.forEach(item => {
        if (item && item.id) {
          videoMap[item.id] = item;
        }
      });
      dbState.videos = Object.values(videoMap);
    }

    // --- TÁCH CÂU PHÁP & VIỆT THÀNH CÁC PHÂN ĐOẠN KARAOKE ĐỒNG BỘ ---
    function findNearestWordBoundary(text, targetPos, minPos) {
      if (targetPos <= minPos) return minPos;
      if (targetPos >= text.length) return text.length;
      if (text[targetPos] === ' ') return targetPos;

      const maxSearch = 18;
      for (let offset = 1; offset <= maxSearch; offset++) {
        const right = targetPos + offset;
        if (right < text.length && text[right] === ' ') return right;
        const left = targetPos - offset;
        if (left > minPos && text[left] === ' ') return left;
      }
      return targetPos;
    }

    function splitTextIntoExactParts(fullText, weights) {
      const cleanText = (fullText || '').trim();
      const count = Array.isArray(weights) ? weights.length : 0;
      if (count <= 0) return [];
      if (!cleanText) return new Array(count).fill('');
      if (count === 1) return [cleanText];

      const totalWeight = weights.reduce((sum, w) => sum + Math.max(1, w || 1), 0);
      const parts = [];
      let cursor = 0;
      let cumWeight = 0;

      for (let k = 0; k < count; k++) {
        if (k === count - 1) {
          parts.push(cleanText.slice(cursor).trim());
        } else {
          cumWeight += Math.max(1, weights[k] || 1);
          const approxPos = Math.round((cumWeight / totalWeight) * cleanText.length);
          const splitPos = findNearestWordBoundary(cleanText, approxPos, cursor);
          parts.push(cleanText.slice(cursor, splitPos).trim());
          cursor = splitPos;
          while (cursor < cleanText.length && cleanText[cursor] === ' ') cursor++;
        }
      }
      return parts;
    }

    function buildKaraokeSubs(frText, viText, subRanges, blockStart, blockEnd) {
      const cleanFr = (frText || '').trim();
      const cleanVi = (viText || '').trim();
      if (!cleanFr && !cleanVi) return [];

      if (!Array.isArray(subRanges) || subRanges.length <= 1) {
        return [{ start: blockStart, end: blockEnd, text: cleanFr, vi: cleanVi }];
      }

      const weights = subRanges.map(s => Math.max(1, s.weight || 1));
      const frRawParts = splitTextIntoExactParts(cleanFr, weights);
      const mergedSubs = [];

      for (let k = 0; k < subRanges.length; k++) {
        const seg = subRanges[k];
        const sliceFr = frRawParts[k] || '';

        if (sliceFr || !cleanFr) {
          mergedSubs.push({
            start: Number(seg.start.toFixed(2)),
            end: Number(seg.end.toFixed(2)),
            text: sliceFr
          });
        } else if (mergedSubs.length > 0) {
          mergedSubs[mergedSubs.length - 1].end = Number(seg.end.toFixed(2));
        }
      }

      // Nối liền các khoảng hở siêu nhỏ (< 0.35s) trong cùng lượt nói để chữ vàng chạy mượt
      for (let k = 0; k < mergedSubs.length - 1; k++) {
        if (mergedSubs[k + 1].start - mergedSubs[k].end < 0.35 && mergedSubs[k + 1].start >= mergedSubs[k].start) {
          mergedSubs[k].end = mergedSubs[k + 1].start;
        }
      }

      if (!mergedSubs.length) {
        return [{ start: blockStart, end: blockEnd, text: cleanFr, vi: cleanVi }];
      }

      // Chia đoạn tiếng Việt thành đúng số phân đoạn của tiếng Pháp để bôi vàng khớp nhịp
      const viWeights = mergedSubs.map(s => (s.text || '').length || Math.max(0.1, s.end - s.start));
      const viParts = splitTextIntoExactParts(cleanVi, viWeights);

      return mergedSubs.map((s, idx) => ({
        start: s.start,
        end: s.end,
        text: s.text,
        vi: viParts[idx] || ''
      }));
    }

    function ensureTranscriptKaraoke(item) {
      const tr = item.transcript || [];
      const raw = item.raw_transcript || [];
      tr.forEach(block => {
        const fr = (block.fr || block.text || '').trim();
        const vi = (block.vi || '').trim();

        // Nếu đã có subs từ bản trước nhưng chưa có trường vi cho từng đoạn nhỏ, tự bổ sung ngay
        if (Array.isArray(block.subs) && block.subs.length > 0) {
          const needsViSplit = vi && block.subs.every(s => s.vi === undefined);
          if (needsViSplit) {
            const viWeights = block.subs.map(s => (s.text || '').length || Math.max(0.1, s.end - s.start));
            const viParts = splitTextIntoExactParts(vi, viWeights);
            block.subs.forEach((s, idx) => { s.vi = viParts[idx] || ''; });
          }
          return;
        }

        if (!fr && !vi) {
          block.subs = [];
          return;
        }
        if (raw.length > 0) {
          const matched = raw.filter(r => {
            const mid = (r.start + r.end) / 2;
            return mid >= block.start - 0.05 && mid <= block.end + 0.05;
          });
          if (matched.length > 1) {
            const subRanges = matched.map((r, idx) => {
              const s = idx === 0 ? Math.max(block.start, r.start) : r.start;
              const e = idx === matched.length - 1 ? Math.min(block.end, r.end) : r.end;
              const origDur = Math.max(0.1, r.end - r.start);
              const ratio = Math.max(0.2, Math.min(1, (e - s) / origDur));
              return {
                start: s,
                end: e,
                weight: ((r.fr || r.text || '').length || 1) * ratio
              };
            });
            block.subs = buildKaraokeSubs(fr, vi, subRanges, block.start, block.end);
            return;
          }
        }
        block.subs = [{ start: block.start, end: block.end, text: fr, vi }];
      });
    }

    function renderKaraokeFrHtml(item, scopeAttr = '') {
      const fr = item.fr || item.text || '';
      if (!fr) return '';
      const subs = (Array.isArray(item.subs) && item.subs.length)
        ? item.subs
        : [{ start: item.start, end: item.end, text: fr }];

      return subs.map((seg, k) => {
        const segText = seg.text !== undefined ? seg.text : (k === 0 ? fr : '');
        if (!segText) return '';
        return `<span class="k-seg" ${scopeAttr} data-k="${k}" data-start="${seg.start}">${escapeHtml(segText)}</span>`;
      }).filter(Boolean).join(' ');
    }

    function renderKaraokeViHtml(item, scopeAttr = '') {
      const vi = item.vi || '';
      if (!vi) return '';
      const subs = (Array.isArray(item.subs) && item.subs.length)
        ? item.subs
        : [{ start: item.start, end: item.end, vi }];

      return subs.map((seg, k) => {
        const segVi = seg.vi !== undefined ? seg.vi : (k === 0 ? vi : '');
        if (!segVi) return '';
        return `<span class="k-seg" ${scopeAttr} data-k="${k}" data-start="${seg.start}">${escapeHtml(segVi)}</span>`;
      }).filter(Boolean).join(' ');
    }

    // --- CHUYỂN ĐỔI KIỂU PHỤ ĐỀ: NGANG <-> DỌC ---
    function applyLayoutMode() {
      const isVert = subLayout === 'vertical';
      subtitleOverlay.className = isVert
        ? 'subtitle-overlay mode-vertical'
        : 'subtitle-overlay mode-horizontal';
      videoWrapper.classList.toggle('has-vertical-sub', isVert && !customSubPos.vertical);

      toggleLayoutBtn.textContent = isVert ? '📐 Kiểu PĐ: Dọc' : '📐 Kiểu PĐ: Ngang';
      floatingLayoutBtn.textContent = isVert ? '📐 PĐ: Dọc' : '📐 PĐ: Ngang';

      renderOverlayStructure();
      applySavedOverlayPosition();
      activeIndex = -1;
      activeSubIndex = -1;
      syncSubtitle(true);
    }

    function toggleLayoutMode() {
      subLayout = subLayout === 'horizontal' ? 'vertical' : 'horizontal';
      localStorage.setItem(LAYOUT_PREF_KEY, subLayout);
      applyLayoutMode();
    }

    toggleLayoutBtn.addEventListener('click', toggleLayoutMode);
    floatingLayoutBtn.addEventListener('click', toggleLayoutMode);

    function renderOverlayStructure() {
      if (subLayout === 'horizontal') {
        subtitleOverlay.innerHTML = '<div id="subtitleBox" class="subtitle-box"></div>';
        return;
      }

      // Chế độ dọc: có thanh kéo vị trí di động + danh sách câu quá khứ - hiện tại - tương lai
      subtitleOverlay.innerHTML = '';
      if (!currentTranscript.length) return;

      const handle = document.createElement('div');
      handle.className = 'v-drag-handle';
      handle.title = 'Kéo để di chuyển khung phụ đề (chạm đúp để về góc mặc định)';
      handle.textContent = '⋮⋮ Kéo vị trí';
      subtitleOverlay.appendChild(handle);

      const listContainer = document.createElement('div');
      listContainer.className = 'v-sub-list';
      listContainer.id = 'vSubList';

      currentTranscript.forEach((item, idx) => {
        const fr = item.fr || item.text || '';
        const vi = item.vi || '';
        const row = document.createElement('div');
        row.className = 'v-sub-item';
        row.id = 'vsub-' + idx;

        let inner = `<span class="v-time">${escapeHtml(item.time || item.start.toFixed(0) + 's')}</span>`;
        if (item.speaker) inner += `<div class="v-speaker">${escapeHtml(item.speaker)}</div>`;
        if (showFr && fr) inner += `<div class="v-fr">${renderKaraokeFrHtml(item, `data-v-idx="${idx}"`)}</div>`;
        if (showVi && vi) inner += `<div class="v-vi">${renderKaraokeViHtml(item, `data-v-idx="${idx}"`)}</div>`;

        row.innerHTML = inner;
        row.onclick = (e) => {
          e.stopPropagation();
          const kSpan = e.target.closest('.k-seg');
          const targetTime = kSpan ? Number(kSpan.dataset.start) : item.start;
          seekTo(targetTime);
        };
        listContainer.appendChild(row);
      });

      subtitleOverlay.appendChild(listContainer);
    }

    // --- TOÀN MÀN HÌNH TƯƠNG THÍCH IPAD SAFARI ---
    function toggleFullscreen() {
      const nativeFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (nativeFs) {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        videoWrapper.classList.remove('pseudo-fs');
        requestAnimationFrame(clampOverlayInBounds);
        return;
      }
      if (videoWrapper.classList.contains('pseudo-fs')) {
        videoWrapper.classList.remove('pseudo-fs');
        requestAnimationFrame(clampOverlayInBounds);
        return;
      }

      const reqFs = videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen;
      if (reqFs) {
        try {
          const p = reqFs.call(videoWrapper);
          if (p && typeof p.catch === 'function') {
            p.catch(() => {
              videoWrapper.classList.add('pseudo-fs');
              requestAnimationFrame(clampOverlayInBounds);
            });
          }
        } catch {
          videoWrapper.classList.add('pseudo-fs');
        }
      } else {
        videoWrapper.classList.add('pseudo-fs');
      }
      requestAnimationFrame(clampOverlayInBounds);
    }
    document.getElementById('toggleFsBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('floatingFsBtn').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => requestAnimationFrame(clampOverlayInBounds));
    document.addEventListener('webkitfullscreenchange', () => requestAnimationFrame(clampOverlayInBounds));

    // --- DANH SÁCH CHƯA XEM, RANDOM & XÁC NHẬN ĐÃ XEM ---
    function getAvailableIds() {
      return Object.keys(videoMap).filter(id => !watchedSet.has(id));
    }

    document.getElementById('randomBtn').addEventListener('click', () => {
      const available = getAvailableIds();
      if (!available.length) {
        alert('Không còn video chưa xem nào trong danh sách!');
        return;
      }
      let candidates = available.filter(id => id !== currentVideoId);
      if (!candidates.length) candidates = available;

      const randomId = candidates[Math.floor(Math.random() * candidates.length)];
      videoSelect.value = randomId;
      loadSelectedVideo(randomId);
      statusEl.textContent = `🎲 Đã chọn ngẫu nhiên [${randomId}] (Còn ${available.length} video chưa xem).`;
    });

    confirmWatchedBtn.addEventListener('click', async () => {
      if (!currentVideoId) return;
      const doneId = currentVideoId;
      watchedSet.add(doneId);
      if (getPinnedVideoId() === doneId) {
        localStorage.removeItem(PINNED_VIDEO_KEY);
        dbState.pinned_id = '';
      }
      await saveToIDB();
      refreshDropdown('', true);
      statusEl.textContent = `✓ Đã xác nhận xong [${doneId}] (Còn lại ${getAvailableIds().length} video chưa xem).`;
    });

    function refreshDropdown(keepId = '', reloadPlayer = true) {
      const availableIds = getAvailableIds();
      const pinnedId = getPinnedVideoId();
      videoSelect.innerHTML = '';

      if (!availableIds.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = Object.keys(videoMap).length > 0
          ? '-- Đã xem hết toàn bộ video trong danh sách! --'
          : '-- Chưa có dữ liệu video --';
        videoSelect.appendChild(opt);
        currentVideoId = '';
        currentTranscript = [];
        updatePinButtonUI();
        renderOverlayStructure();
        transcriptBox.innerHTML = '';
        exportBox.value = '';
        confirmWatchedBtn.disabled = true;
        return;
      }

      confirmWatchedBtn.disabled = false;

      availableIds.forEach(id => {
        const info = videoMap[id];
        const tr = info.transcript || [];
        const hasVi = tr.some(line => line.vi && line.vi.trim() !== '');
        const tag = hasVi ? '★ Song ngữ' : (tr.length ? '✓ Pháp' : '✗ Trống');
        const pinPrefix = (id === pinnedId) ? '📌 ' : '';
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${pinPrefix}[${id}] ${info.title || 'Không tiêu đề'} (${tag})`;
        videoSelect.appendChild(opt);
      });

      if (keepId && availableIds.includes(keepId)) videoSelect.value = keepId;
      if (reloadPlayer) {
        loadSelectedVideo(videoSelect.value);
      } else {
        updatePinButtonUI();
      }
    }

    videoSelect.addEventListener('change', () => loadSelectedVideo(videoSelect.value));

    function loadSelectedVideo(id) {
      if (!id || !videoMap[id]) return;
      currentVideoId = id;
      updatePinButtonUI();
      const item = videoMap[id];
      ensureTranscriptKaraoke(item);
      currentTranscript = item.transcript || [];
      activeIndex = -1;
      activeSubIndex = -1;
      importBox.value = '';

      renderOverlayStructure();
      applySavedOverlayPosition();
      renderTranscriptList();
      populateExportBox(item);

      const rawUrl = item.url || '';
      if (rawUrl && !rawUrl.includes('youtube.com') && !rawUrl.includes('youtu.be')) {
        switchToHtml5(rawUrl);
      } else {
        switchToYouTube(id);
      }
    }

    document.getElementById('localVideoInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      switchToHtml5(URL.createObjectURL(file));
      statusEl.textContent = 'Đang phát file offline: ' + file.name;
    });

    // --- COPY PROMPT & LƯU BẢN DỊCH AI VÀO INDEXEDDB ---
    function populateExportBox(item) {
      const url = item.url || `https://www.youtube.com/watch?v=${item.id}`;
      const sourceLines = item.raw_transcript || item.transcript || [];
      const compactLines = sourceLines.map((line, idx) => ({
        i: idx,
        time: line.time || '',
        start: line.start,
        end: line.end,
        fr: line.fr || line.text || ''
      }));

      exportBox.value =
        `${AI_PROMPT}\n` +
        `Link video: ${url}\n` +
        `Tiêu đề: ${item.title || ''}\n\n` +
        JSON.stringify(compactLines, null, 2);
    }

    document.getElementById('copyRawBtn').addEventListener('click', async () => {
      if (!exportBox.value) return;
      try {
        await navigator.clipboard.writeText(exportBox.value);
      } catch {
        exportBox.select();
        document.execCommand('copy');
      }
      const btn = document.getElementById('copyRawBtn');
      btn.textContent = '✓ Đã copy!';
      setTimeout(() => btn.textContent = '📋 Copy trọn bộ', 1800);
    });

    document.getElementById('saveSubBtn').addEventListener('click', async () => {
      if (!currentVideoId || !currentTranscript.length) {
        alert('Chưa có video hoặc phụ đề gốc để cập nhật!');
        return;
      }
      let rawText = importBox.value.trim();
      if (!rawText) {
        alert('Hãy dán mảng JSON từ AI vào ô bên dưới trước khi bấm Lưu!');
        return;
      }
      rawText = rawText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

      let parsed;
      try {
        parsed = JSON.parse(rawText);
      } catch (err) {
        alert('Dữ liệu dán vào chưa đúng chuẩn JSON:\n' + err.message);
        return;
      }
      if (!Array.isArray(parsed) || !parsed.length) {
        alert('Dữ liệu JSON phải là một danh sách [...] các đoạn phụ đề.');
        return;
      }

      // Giữ bản sao phụ đề ASR gốc để luôn tính đúng mốc thời gian Karaoke nếu dán lại JSON sau này
      if (!videoMap[currentVideoId].raw_transcript) {
        videoMap[currentVideoId].raw_transcript = JSON.parse(JSON.stringify(currentTranscript));
      }
      const baseTranscript = videoMap[currentVideoId].raw_transcript;

      try {
        if (navigator.storage && navigator.storage.persist) {
          await navigator.storage.persist();
        }

        // Hỗ trợ định dạng mới (from_i, to_i, speaker) kèm mốc thời gian Karaoke từng đoạn nhỏ
        if (typeof parsed[0].from_i === 'number') {
          const maxIdx = baseTranscript.length - 1;
          const blocks = parsed.map((row, bIdx) => {
            const fIdx = Math.max(0, Math.min(maxIdx, row.from_i));
            const tIdx = Math.max(fIdx, Math.min(maxIdx, typeof row.to_i === 'number' ? row.to_i : fIdx));
            const firstLine = baseTranscript[fIdx];
            const lastLine = baseTranscript[tIdx];

            let start = firstLine.start;
            let end = lastLine.end;
            const splitAtStart = bIdx > 0 && parsed[bIdx - 1].to_i === fIdx;
            const splitAtEnd = bIdx < parsed.length - 1 && parsed[bIdx + 1].from_i === tIdx;

            if (splitAtStart) {
              start = (firstLine.start + firstLine.end) / 2;
            }
            if (splitAtEnd) {
              end = (lastLine.start + lastLine.end) / 2;
            }

            // Tạo danh sách các khoảng thời gian con từ fIdx -> tIdx để chạy màu Karaoke
            const subRanges = [];
            for (let k = fIdx; k <= tIdx; k++) {
              const origLine = baseTranscript[k];
              let s = origLine.start;
              let e = origLine.end;
              let weight = (origLine.fr || origLine.text || '').length || 1;

              if (k === fIdx && splitAtStart) {
                s = start;
                weight *= 0.5;
              }
              if (k === tIdx && splitAtEnd) {
                e = end;
                weight *= 0.5;
              }
              if (e < s) e = s;
              subRanges.push({ start: s, end: e, weight });
            }

            const frText = (row.fr || '').trim();
            const viText = (row.vi || '').trim();
            const blockStart = Number(start.toFixed(2));
            const blockEnd = Number(end.toFixed(2));

            return {
              time: firstLine.time || '',
              start: blockStart,
              end: blockEnd,
              speaker: (row.speaker || '').trim(),
              fr: frText,
              vi: viText,
              subs: buildKaraokeSubs(frText, viText, subRanges, blockStart, blockEnd)
            };
          });

          videoMap[currentVideoId].transcript = blocks;
          await saveToIDB();
          await setPinnedVideoId(currentVideoId);
          refreshDropdown(currentVideoId, true);
          statusEl.textContent = `✓ Đã lưu & ghim ${blocks.length} lượt thoại Karaoke vào bộ nhớ iPad!`;
          return;
        }

        // Giữ tương thích ngược nếu dán JSON định dạng từng dòng {"i": ...}
        const byIndex = {};
        parsed.forEach((row, idx) => {
          const key = typeof row.i === 'number' ? row.i : idx;
          byIndex[key] = row;
        });

        let updatedCount = 0;
        videoMap[currentVideoId].transcript = baseTranscript.map((orig, idx) => {
          const aiRow = byIndex[idx];
          if (aiRow) {
            updatedCount++;
            const frText = (aiRow.fr || aiRow.text || orig.fr || orig.text || '').trim();
            const viText = (aiRow.vi || '').trim();
            return {
              time: orig.time,
              start: orig.start,
              end: orig.end,
              speaker: (aiRow.speaker || orig.speaker || '').trim(),
              fr: frText,
              vi: viText,
              subs: [{ start: orig.start, end: orig.end, text: frText, vi: viText }]
            };
          }
          return orig;
        });

        await saveToIDB();
        await setPinnedVideoId(currentVideoId);
        refreshDropdown(currentVideoId, true);
        statusEl.textContent = `✓ Đã lưu & ghim bản dịch song ngữ (${updatedCount}/${baseTranscript.length} câu) vào bộ nhớ iPad!`;
      } catch (err) {
        alert('Không thể lưu vào bộ nhớ iPad (hãy tắt Duyệt web riêng tư hoặc kiểm tra dung lượng máy):\n' + err.message);
      }
    });

    // --- TRÌNH PHÁT & ĐỒNG BỘ PHỤ ĐỀ KARAOKE THỜI GIAN THỰC ---
    function switchToHtml5(src) {
      isUsingYouTube = false;
      if (ytPlayer?.stopVideo) ytPlayer.stopVideo();
      ytDiv.style.display = 'none';
      html5Video.style.display = 'block';
      html5Video.src = src;
    }

    function switchToYouTube(videoId) {
      isUsingYouTube = true;
      html5Video.pause();
      html5Video.style.display = 'none';
      ytDiv.style.display = 'block';
      if (ytPlayer?.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      } else {
        window.pendingYtId = videoId;
        if (!document.getElementById('yt-api-script')) {
          const tag = document.createElement('script');
          tag.id = 'yt-api-script';
          tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        }
      }
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('ytPlayer', {
        videoId: window.pendingYtId || '',
        playerVars: { playsinline: 1, fs: 0, rel: 0, cc_load_policy: 0 }
      });
    };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function renderTranscriptList() {
      transcriptBox.innerHTML = '';
      currentTranscript.forEach((item, idx) => {
        const vi = item.vi || '';
        const div = document.createElement('div');
        div.className = 'line';
        div.id = 'line-' + idx;
        div.innerHTML = `
          <span class="time">${item.time || item.start.toFixed(1) + 's'}</span>
          <div>
            ${item.speaker ? `<span class="speaker-badge">${escapeHtml(item.speaker)}</span>` : ''}
            <div class="line-fr">${renderKaraokeFrHtml(item, `data-l-idx="${idx}"`)}</div>
            ${vi ? `<div class="line-vi">${renderKaraokeViHtml(item, `data-l-idx="${idx}"`)}</div>` : ''}
          </div>
        `;
        div.onclick = (e) => {
          const kSpan = e.target.closest('.k-seg');
          const targetTime = kSpan ? Number(kSpan.dataset.start) : item.start;
          seekTo(targetTime);
        };
        transcriptBox.appendChild(div);
      });
    }

    function seekTo(seconds) {
      if (isUsingYouTube && ytPlayer?.seekTo) {
        ytPlayer.seekTo(seconds, true);
        ytPlayer.playVideo();
      } else {
        html5Video.currentTime = seconds;
        html5Video.play();
      }
    }

    function updateKaraokeHighlight(blockIdx, subIdx) {
      document.querySelectorAll('.k-seg.active').forEach(el => el.classList.remove('active'));
      if (blockIdx === -1 || subIdx === -1) return;

      document.querySelectorAll(`#subtitleBox .k-seg[data-k="${subIdx}"]`).forEach(el => el.classList.add('active'));
      document.querySelectorAll(`.k-seg[data-v-idx="${blockIdx}"][data-k="${subIdx}"]`).forEach(el => el.classList.add('active'));
      document.querySelectorAll(`.k-seg[data-l-idx="${blockIdx}"][data-k="${subIdx}"]`).forEach(el => el.classList.add('active'));
    }

    function syncSubtitle(forceRender = false) {
      if (!currentTranscript.length) return;
      const currentTime = (isUsingYouTube && ytPlayer?.getCurrentTime)
        ? ytPlayer.getCurrentTime()
        : html5Video.currentTime;

      const idx = currentTranscript.findIndex(item => currentTime >= item.start && currentTime <= item.end);
      const turnChanged = idx !== activeIndex || forceRender;

      if (turnChanged) {
        if (activeIndex !== -1) {
          document.getElementById('line-' + activeIndex)?.classList.remove('active');
          document.getElementById('vsub-' + activeIndex)?.classList.remove('active');
        }
        activeIndex = idx;
        activeSubIndex = -1;

        if (subLayout === 'horizontal') {
          const box = document.getElementById('subtitleBox');
          if (box) {
            if (idx !== -1) {
              const item = currentTranscript[idx];
              const fr = item.fr || item.text || '';
              const vi = item.vi || '';
              let html = '';
              if (item.speaker) html += `<div class="speaker-badge">${escapeHtml(item.speaker)}</div>`;
              if (showFr && fr) html += `<div class="sub-fr">${renderKaraokeFrHtml(item)}</div>`;
              if (showVi && vi) html += `<div class="sub-vi">${renderKaraokeViHtml(item)}</div>`;
              box.innerHTML = html;
              if (customSubPos[getCurrentPosKey()]) {
                clampOverlayInBounds();
              }
            } else {
              box.innerHTML = '';
            }
          }
        } else if (idx !== -1) {
          const activeVSub = document.getElementById('vsub-' + idx);
          const vSubList = document.getElementById('vSubList');
          if (activeVSub && vSubList) {
            activeVSub.classList.add('active');
            const targetScroll = activeVSub.offsetTop - (vSubList.clientHeight / 2) + (activeVSub.clientHeight / 2);
            vSubList.scrollTo({ top: Math.max(0, targetScroll), behavior: forceRender ? 'auto' : 'smooth' });
          }
        }

        if (idx !== -1) {
          const activeLine = document.getElementById('line-' + idx);
          if (activeLine) {
            activeLine.classList.add('active');
            if (!forceRender) activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      }

      // Cập nhật phần cụm từ bôi vàng Karaoke cho cả tiếng Pháp & tiếng Việt trong lượt thoại đang chạy
      let subIdx = -1;
      if (idx !== -1) {
        const subs = currentTranscript[idx].subs || [];
        subIdx = subs.findIndex(s => currentTime >= s.start && currentTime <= s.end);
      }

      if (turnChanged || subIdx !== activeSubIndex) {
        activeSubIndex = subIdx;
        updateKaraokeHighlight(idx, subIdx);
      }
    }

    setInterval(syncSubtitle, 100);
    html5Video.addEventListener('timeupdate', () => syncSubtitle(false));
  </script>
</body>
