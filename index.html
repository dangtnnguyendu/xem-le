<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Xem Lẻ YouTube">
  <title>Xem Lẻ Video Song Ngữ Pháp - Việt</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 14px 48px;
      background: #121212;
      color: #eee;
    }
    .panel {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 10px;
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 14px;
      border: 1px solid #2c2c2c;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
    }
    button {
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13.5px;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-yellow { background: #ffeb3b; color: #111; }
    .btn-blue { background: #2196f3; color: #fff; }
    .btn-teal { background: #00897b; color: #fff; }
    .btn-green { background: #4caf50; color: #fff; }
    .btn-gray { background: #383838; color: #eee; }
    .btn-off { background: #242424; color: #777; border: 1px solid #383838; }
    .btn-unpinned { background: #333; color: #ffd54f; border: 1px solid #555; }
    .btn-pinned { background: #ff9800; color: #111; border: 1px solid #ffb74d; }

    /* Thanh tinh chỉnh đồng bộ thời gian phụ đề */
    .timing-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: #161616;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2b2b2b;
      font-size: 12.5px;
    }
    .timing-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #222;
      padding: 4px 6px;
      border-radius: 7px;
      border: 1px solid #333;
    }
    .timing-group button {
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 5px;
      background: #333;
      color: #fff;
    }
    .timing-val {
      min-width: 86px;
      text-align: center;
      font-family: monospace;
      font-weight: 700;
      color: #ffd54f;
      cursor: pointer;
      padding: 2px 4px;
    }
    .timing-hint {
      color: #9e9e9e;
      font-size: 12px;
    }

    details {
      background: #161616;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2b2b2b;
      font-size: 13px;
    }
    summary { cursor: pointer; color: #ffd54f; font-weight: 600; user-select: none; }
    .input-grid { display: grid; gap: 10px; margin-top: 10px; }

    /* Khung phát video & toàn màn hình đẩy sát mép trên */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .video-wrapper.pseudo-fs,
    .video-wrapper:fullscreen,
    .video-wrapper:-webkit-full-screen {
      position: fixed !important;
      top: 0; left: 0;
      width: 100vw !important;
      height: 100dvh !important;
      z-index: 99999;
      border-radius: 0;
      background: #000;
      display: flex !important;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    #ytPlayer { width: 100%; height: 100%; display: block; }

    .video-wrapper.pseudo-fs #ytPlayer,
    .video-wrapper:fullscreen #ytPlayer,
    .video-wrapper:-webkit-full-screen #ytPlayer {
      width: 100% !important;
      max-width: calc(100vh * 16 / 9);
      max-width: calc(100dvh * 16 / 9);
      height: auto !important;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
    }

    .video-wrapper.dragging-sub #ytPlayer {
      pointer-events: none !important;
    }

    .speaker-badge {
      display: inline-block;
      background: rgba(255, 152, 0, 0.24);
      color: #ffcc80;
      border: 1px solid rgba(255, 183, 77, 0.35);
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 5px;
      letter-spacing: 0.3px;
      vertical-align: middle;
    }

    /* --- HIỂN THỊ 2 CÂU / LƯỢT, CHỈ HIGHLIGHT 1 CÂU ĐANG NÓI --- */
    .sub-pair-line {
      padding: 4px 8px;
      border-radius: 6px;
      border-left: 3px solid transparent;
      transition: opacity 0.14s ease, background-color 0.14s ease, border-color 0.14s ease;
    }
    .sub-pair-line + .sub-pair-line {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Câu đang nói (Highlight 1 câu duy nhất) */
    .sub-pair-line.is-active {
      opacity: 1;
      background: rgba(255, 193, 7, 0.14);
      border-left-color: #ffd54f;
    }
    .sub-pair-line.is-active .sub-fr,
    .sub-pair-line.is-active .v-fr {
      color: #ffd54f;
      font-weight: 700;
    }
    .sub-pair-line.is-active .sub-vi,
    .sub-pair-line.is-active .v-vi {
      color: #ffffff;
      font-weight: 600;
    }

    /* Câu thứ 2 chờ đọc (Không highlight, làm dịu mắt) */
    .sub-pair-line.is-inactive {
      opacity: 0.56;
    }
    .sub-pair-line.is-inactive .sub-fr,
    .sub-pair-line.is-inactive .v-fr {
      color: #e0e0e0;
      font-weight: 500;
    }
    .sub-pair-line.is-inactive .sub-vi,
    .sub-pair-line.is-inactive .v-vi {
      color: #bdbdbd;
      font-weight: 400;
    }

    /* --- CHẾ ĐỘ PHỤ ĐỀ 1: NẰM NGANG --- */
    .subtitle-overlay.mode-horizontal {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 94%;
      text-align: left;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      z-index: 20;
    }
    .video-wrapper.pseudo-fs .subtitle-overlay.mode-horizontal,
    .video-wrapper:fullscreen .subtitle-overlay.mode-horizontal,
    .video-wrapper:-webkit-full-screen .subtitle-overlay.mode-horizontal {
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      max-width: 95%;
    }
    .subtitle-overlay.mode-horizontal:active { cursor: grabbing; }
    .subtitle-overlay.mode-horizontal .subtitle-box {
      display: inline-block;
      background: rgba(0, 0, 0, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 7px 12px;
      border-radius: 9px;
      line-height: 1.35;
      max-width: 100%;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.85);
    }
    .subtitle-overlay.mode-horizontal .subtitle-box:empty { display: none; }
    .sub-fr { font-size: 15px; }
    .sub-vi { font-size: 13.5px; margin-top: 2px; }

    .video-wrapper.pseudo-fs .mode-horizontal .sub-fr,
    .video-wrapper:fullscreen .mode-horizontal .sub-fr,
    .video-wrapper:-webkit-full-screen .mode-horizontal .sub-fr { font-size: 19.5px; }
    .video-wrapper.pseudo-fs .mode-horizontal .sub-vi,
    .video-wrapper:fullscreen .mode-horizontal .sub-vi,
    .video-wrapper:-webkit-full-screen .mode-horizontal .sub-vi { font-size: 16.5px; }

    /* --- CHẾ ĐỘ PHỤ ĐỀ 2: NẰM DỌC (CŨNG HIỂN THỊ 2 CÂU / LƯỢT) --- */
    .subtitle-overlay.mode-vertical {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 21%;
      min-width: 150px;
      max-height: calc(100% - 54px);
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
      z-index: 20;
      text-align: left;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
    }
    .subtitle-overlay.mode-vertical.is-empty { display: none; }

    .v-drag-handle {
      flex-shrink: 0;
      padding: 3px 6px;
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      font-size: 9.5px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.4px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .v-drag-handle:active { cursor: grabbing; color: #ffb300; }

    .v-sub-list {
      padding: 6px;
      overflow-y: auto;
    }
    .v-fr { font-size: 11px; line-height: 1.3; word-break: break-word; }
    .v-vi { font-size: 10px; line-height: 1.28; margin-top: 2px; word-break: break-word; }

    .floating-controls {
      position: absolute;
      top: 52px;
      right: 12px;
      z-index: 25;
      display: flex;
      gap: 6px;
      transition: right 0.2s;
    }
    .video-wrapper.has-vertical-sub .floating-controls {
      right: calc(21% + 16px);
    }
    .floating-btn {
      background: rgba(0, 0, 0, 0.46);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Danh sách toàn bộ kịch bản phía dưới */
    .transcript-box {
      margin-top: 14px;
      max-height: 290px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #2c2c2c;
    }
    .transcript-box:empty { display: none; }
    .line {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      font-size: 14.5px;
      border-bottom: 1px solid #262626;
      border-left: 3px solid transparent;
    }
    .line:active, .line:hover { background: #2a2a2a; }
    .line.active {
      background: #332b00;
      border-left-color: #ffd54f;
    }
    .line-fr { color: #ffffff; }
    .line.active .line-fr { color: #ffd54f; font-weight: 700; }
    .time { color: #888; min-width: 48px; font-family: monospace; padding-top: 2px; font-size: 12.5px; }
    .line-vi { color: #dcdcdc; font-size: 13.5px; margin-top: 4px; }
    .line.active .line-vi { color: #ffffff; }

    .ai-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    @media (max-width: 720px) { .ai-grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%;
      height: 125px;
      background: #141414;
      color: #dcdcdc;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
    }
    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
    }
    #status { color: #4caf50; font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- BẢNG NHẬP NHANH & ĐIỀU KHIỂN HIỂN THỊ -->
  <div class="panel">
    <details id="inputDrawer" open>
      <summary>🎬 Nhập link YouTube & Bản chép lời</summary>
      <div class="input-grid">
        <div class="row">
          <input type="text" id="ytUrlInput" placeholder="Dán link YouTube (vd: https://youtu.be/... hoặc https://www.youtube.com/watch?v=...)">
        </div>
        <textarea id="rawTranscriptInput" placeholder="Dán định dạng start|end|từ, hoặc 0:00 Bonjour..., hoặc file .srt vào đây..."></textarea>
        <div class="row">
          <button type="button" class="btn-green" id="playSingleBtn">▶ Phát ngay</button>
          <button type="button" class="btn-gray" id="resetAllBtn">↺ Làm mới phiên xem</button>
        </div>
      </div>
    </details>

    <div class="row">
      <button type="button" class="btn-unpinned" id="pinBtn" disabled title="Ghim video đang xem để giữ nguyên khi tải lại trang">📌 Ghim</button>
      <button type="button" class="btn-blue" id="toggleFrBtn">🇫🇷 Pháp: BẬT</button>
      <button type="button" class="btn-blue" id="toggleViBtn">🇻🇳 Việt: BẬT</button>
      <button type="button" class="btn-teal" id="toggleLayoutBtn">📐 Kiểu PĐ: Ngang</button>
      <button type="button" class="btn-yellow" id="toggleFsBtn">⛶ Toàn màn hình</button>
    </div>

    <!-- THANH ĐIỀU CHỈNH DELAY & KÉO DÀI THỜI GIAN PHỤ ĐỀ -->
    <div class="timing-bar">
      <div class="timing-group" title="Chữ hiện sớm hơn tiếng -> bấm + | Chữ hiện trễ hơn tiếng -> bấm -">
        <button type="button" id="delayMinusBig">-0.5s</button>
        <button type="button" id="delayMinus">-0.1s</button>
        <span class="timing-val" id="delayValBtn" title="Bấm để đặt lại Delay = 0.0s">Delay: 0.0s</span>
        <button type="button" id="delayPlus">+0.1s</button>
        <button type="button" id="delayPlusBig">+0.5s</button>
      </div>

      <div class="timing-group" title="Kéo dài thêm thời gian giữ phụ đề trên màn hình sau khi dứt câu">
        <button type="button" id="holdMinus">-0.3s</button>
        <span class="timing-val" id="holdValBtn" title="Bấm để đặt lại Giữ thêm = +0.4s">Giữ: +0.4s</span>
        <button type="button" id="holdPlus">+0.3s</button>
      </div>

      <div class="timing-group" title="Ép mỗi câu hiện tối thiểu bao nhiêu giây (tự chặn trước câu sau)">
        <button type="button" id="minDurBtn">Tối thiểu: 2.0s</button>
      </div>

      <div class="timing-group" title="Tinh chỉnh nếu càng về cuối video phụ đề càng lệch dần">
        <button type="button" id="scaleMinus">-0.005x</button>
        <span class="timing-val" id="scaleValBtn" title="Bấm để đặt lại Tốc độ = 1.000x">Tốc: 1.000x</span>
        <button type="button" id="scalePlus">+0.005x</button>
      </div>
    </div>

    <div id="status">Sẵn sàng — Hiển thị 2 câu/lượt, chỉ highlight 1 câu đang nói. Chạm và kéo khung phụ đề để đặt vị trí tùy ý.</div>
  </div>

  <!-- KHUNG PHÁT VIDEO -->
  <div class="video-wrapper" id="videoWrapper">
    <div class="floating-controls">
      <button type="button" class="floating-btn" id="floatingLayoutBtn">📐 PĐ: Ngang</button>
      <button type="button" class="floating-btn" id="floatingFsBtn">⛶ Toàn màn hình</button>
    </div>
    <div id="ytPlayer"></div>
    <div id="subtitleOverlay" class="subtitle-overlay mode-horizontal">
      <div id="subtitleBox" class="subtitle-box"></div>
    </div>
  </div>

  <!-- DỊCH PHỤ ĐỀ QUA AI TRONG PHIÊN XEM -->
  <div class="ai-grid">
    <div class="panel" style="margin-bottom:0;">
      <div class="box-header">
        <span>1. Prompt + Phụ đề gốc (Gửi AI)</span>
        <button type="button" class="btn-blue" id="copyRawBtn">📋 Copy trọn bộ</button>
      </div>
      <textarea id="exportBox" readonly placeholder="Sau khi bấm Phát ngay, Prompt kèm phụ đề gốc sẽ tự tạo ở đây..."></textarea>
    </div>

    <div class="panel" style="margin-bottom:0;">
      <div class="box-header">
        <span>2. Dán JSON song ngữ từ AI</span>
        <button type="button" class="btn-green" id="applySubBtn">✨ Áp dụng phụ đề</button>
      </div>
      <textarea id="importBox" placeholder='Dán mảng JSON [{"from_i": 0, "to_i": 1, "speaker": "...", "fr": "...", "vi": "..."}] từ AI vào đây rồi bấm Áp dụng...'></textarea>
    </div>
  </div>

  <!-- DANH SÁCH CÂU THOẠI -->
  <div class="transcript-box" id="transcriptBox"></div>

  <script>
    const AI_PROMPT = `Bạn là chuyên gia biên tập và dịch thuật phụ đề song ngữ Pháp - Việt cho video hội thoại.
Dưới đây là link video và mảng JSON chứa bản chép lời tiếng Pháp kèm mốc thời gian.

NHIỆM VỤ CỦA BN:
1. Gộp câu theo từng lượt nói / suy nghĩ của nhân vật:
  - Gộp các mảnh liên tiếp thuộc cùng một nhân vật thành một đoạn hoàn chỉnh (1-2 câu ngắn/đoạn để hiển thị cặp 2 câu gọn trên màn hình).
  - Nếu một dòng bị dính lời của 2 nhân vật khác nhau, hãy tách thành 2 phần tử riêng biệt và dùng chung chỉ số "from_i" / "to_i" tại điểm giao nhau.
2. Xác định người nói ("speaker"):
  - Ghi rõ tên nhân vật hoặc vai trò đang nói (nếu không rõ tên có thể để trống "").
3. Đánh bóng tiếng Pháp ("fr") & Dịch tiếng Việt ("vi"):
  - Sửa lỗi chính tả, thêm dấu câu chuẩn ngữ pháp tiếng Pháp.
  - Dịch sang tiếng Việt tự nhiên, đúng ngữ cảnh. Không dùng dấu ngoặc kép (") bên trong chuỗi dịch, thay bằng « ».

ĐỊNH DẠNG ĐẦU RA BẮT BUỘC (Chỉ trả về duy nhất 1 khối JSON hợp lệ):
[
  {"from_i": 0, "to_i": 1, "speaker": "Tên nhân vật", "fr": "Đoạn tiếng Pháp hoàn chỉnh.", "vi": "Đoạn dịch tiếng Việt tương ứng."}
]

DỮ LIỆU VIDEO VÀ PHỤ ĐỀ THÔ CẦN XỬ LÝ:`;

    const PIN_STORAGE_KEY = 'xem_le_pinned_session_v1';

    let currentVideoId = '';
    let baseTranscript = [];
    let currentTranscript = [];
    let activeIndex = -1;
    let renderedPairStart = -1;
    let lastActiveIndex = -1;
    let lastActiveRawEnd = -999;

    let ytPlayer = null;
    let showFr = true;
    let showVi = true;
    let subLayout = 'horizontal'; // 'horizontal' | 'vertical'
    let isPinned = false;
    let lastSavedTime = 0;

    // Tham số tinh chỉnh thời gian phụ đề
    let subDelay = 0.0;      // giây (+: hiện trễ hơn audio, -: hiện sớm hơn audio)
    let subHold = 0.4;       // giây kéo dài thêm ở đuôi câu
    let minSubDur = 2.0;     // thời lượng tối thiểu mỗi câu (giây)
    let timeScale = 1.000;   // hệ số co giãn tốc độ chống trôi về cuối video

    let customSubPos = {
      horizontal: null,
      horizontalFs: null,
      vertical: null
    };

    const videoWrapper = document.getElementById('videoWrapper');
    const subtitleOverlay = document.getElementById('subtitleOverlay');
    const transcriptBox = document.getElementById('transcriptBox');
    const exportBox = document.getElementById('exportBox');
    const importBox = document.getElementById('importBox');
    const statusEl = document.getElementById('status');
    const pinBtn = document.getElementById('pinBtn');
    const toggleLayoutBtn = document.getElementById('toggleLayoutBtn');
    const floatingLayoutBtn = document.getElementById('floatingLayoutBtn');

    // --- ĐIỀU KHIỂN DELAY / KÉO DÀI / TỐC ĐỘ ---
    const delayValBtn = document.getElementById('delayValBtn');
    const holdValBtn = document.getElementById('holdValBtn');
    const minDurBtn = document.getElementById('minDurBtn');
    const scaleValBtn = document.getElementById('scaleValBtn');

    function updateTimingUI() {
      const dSign = subDelay > 0 ? '+' : '';
      delayValBtn.textContent = `Delay: ${dSign}${subDelay.toFixed(1)}s`;
      holdValBtn.textContent = `Giữ: +${subHold.toFixed(1)}s`;
      minDurBtn.textContent = minSubDur > 0 ? `Tối thiểu: ${minSubDur.toFixed(1)}s` : 'Tối thiểu: Tắt';
      scaleValBtn.textContent = `Tốc: ${timeScale.toFixed(3)}x`;
    }

    function onTimingChanged() {
      updateTimingUI();
      activeIndex = -1;
      renderedPairStart = -1;
      lastActiveIndex = -1;
      syncSubtitle(true);
      if (isPinned) savePinnedSession();
    }

    document.getElementById('delayMinusBig').addEventListener('click', () => { subDelay = Number((subDelay - 0.5).toFixed(1)); onTimingChanged(); });
    document.getElementById('delayMinus').addEventListener('click', () => { subDelay = Number((subDelay - 0.1).toFixed(1)); onTimingChanged(); });
    document.getElementById('delayPlus').addEventListener('click', () => { subDelay = Number((subDelay + 0.1).toFixed(1)); onTimingChanged(); });
    document.getElementById('delayPlusBig').addEventListener('click', () => { subDelay = Number((subDelay + 0.5).toFixed(1)); onTimingChanged(); });
    delayValBtn.addEventListener('click', () => { subDelay = 0.0; onTimingChanged(); });

    document.getElementById('holdMinus').addEventListener('click', () => { subHold = Math.max(0, Number((subHold - 0.3).toFixed(1))); onTimingChanged(); });
    document.getElementById('holdPlus').addEventListener('click', () => { subHold = Math.min(5.0, Number((subHold + 0.3).toFixed(1))); onTimingChanged(); });
    holdValBtn.addEventListener('click', () => { subHold = 0.4; onTimingChanged(); });

    const MIN_DUR_PRESETS = [0, 1.5, 2.0, 2.5, 3.5];
    minDurBtn.addEventListener('click', () => {
      const curIdx = MIN_DUR_PRESETS.indexOf(minSubDur);
      minSubDur = MIN_DUR_PRESETS[(curIdx + 1) % MIN_DUR_PRESETS.length];
      onTimingChanged();
    });

    document.getElementById('scaleMinus').addEventListener('click', () => { timeScale = Math.max(0.8, Number((timeScale - 0.005).toFixed(3))); onTimingChanged(); });
    document.getElementById('scalePlus').addEventListener('click', () => { timeScale = Math.min(1.2, Number((timeScale + 0.005).toFixed(3))); onTimingChanged(); });
    scaleValBtn.addEventListener('click', () => { timeScale = 1.000; onTimingChanged(); });

    // Tính thời điểm kết thúc hiển thị thực tế của câu thứ idx (có kéo dài nhưng không đè sang câu idx + 1)
    function getEffectiveEnd(idx) {
      const item = currentTranscript[idx];
      if (!item) return 0;
      const baseEnd = Math.max(item.end, item.start + 0.25);
      let extendedEnd = Math.max(baseEnd + subHold, item.start + minSubDur);

      if (idx + 1 < currentTranscript.length) {
        const nextStart = currentTranscript[idx + 1].start;
        if (nextStart > item.start + 0.2) {
          extendedEnd = Math.min(extendedEnd, nextStart - 0.04);
        }
      }
      return extendedEnd;
    }

    function isVideoFullscreen() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        videoWrapper.classList.contains('pseudo-fs')
      );
    }

    function getCurrentPosKey() {
      if (subLayout === 'vertical') return 'vertical';
      return isVideoFullscreen() ? 'horizontalFs' : 'horizontal';
    }

    // --- KÉO THẢ DI ĐỘNG KHUNG PHỤ ĐỀ ---
    let dragState = null;
    let lastTapTime = 0;

    function resetOverlayInlinePosition() {
      subtitleOverlay.style.left = '';
      subtitleOverlay.style.top = '';
      subtitleOverlay.style.right = '';
      subtitleOverlay.style.bottom = '';
      subtitleOverlay.style.transform = '';
    }

    function applySavedOverlayPosition() {
      const posKey = getCurrentPosKey();
      const pos = customSubPos[posKey];
      if (!pos) {
        resetOverlayInlinePosition();
        if (subLayout === 'vertical') {
          videoWrapper.classList.add('has-vertical-sub');
        }
        return;
      }

      const wrapRect = videoWrapper.getBoundingClientRect();
      const ovRect = subtitleOverlay.getBoundingClientRect();
      if (!wrapRect.width || !wrapRect.height) return;

      const maxLeft = Math.max(4, wrapRect.width - ovRect.width - 4);
      const maxTop = Math.max(4, wrapRect.height - ovRect.height - 4);
      const clampedLeft = Math.min(maxLeft, Math.max(4, pos.leftRatio * wrapRect.width));
      const clampedTop = Math.min(maxTop, Math.max(4, pos.topRatio * wrapRect.height));

      subtitleOverlay.style.left = clampedLeft + 'px';
      subtitleOverlay.style.top = clampedTop + 'px';
      subtitleOverlay.style.right = 'auto';
      subtitleOverlay.style.bottom = 'auto';
      subtitleOverlay.style.transform = 'none';

      if (subLayout === 'vertical') {
        videoWrapper.classList.remove('has-vertical-sub');
      }
    }

    function clampOverlayInBounds() {
      applySavedOverlayPosition();
    }

    function getClientPoint(e) {
      if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function startSubDrag(e) {
      if (subLayout === 'horizontal') {
        if (!e.target.closest('#subtitleOverlay')) return;
      } else {
        if (!e.target.closest('.v-drag-handle')) return;
      }

      const now = Date.now();
      if (now - lastTapTime < 300) {
        lastTapTime = 0;
        customSubPos[getCurrentPosKey()] = null;
        applySavedOverlayPosition();
        if (isPinned) savePinnedSession();
        e.preventDefault();
        return;
      }
      lastTapTime = now;

      const pt = getClientPoint(e);
      const wrapRect = videoWrapper.getBoundingClientRect();
      const ovRect = subtitleOverlay.getBoundingClientRect();

      dragState = {
        startX: pt.x,
        startY: pt.y,
        origLeft: ovRect.left - wrapRect.left,
        origTop: ovRect.top - wrapRect.top,
        moved: false
      };

      videoWrapper.classList.add('dragging-sub');
      if (e.cancelable) e.preventDefault();
    }

    function onSubDragMove(e) {
      if (!dragState) return;
      const pt = getClientPoint(e);
      const dx = pt.x - dragState.startX;
      const dy = pt.y - dragState.startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;

      const wrapRect = videoWrapper.getBoundingClientRect();
      const ovRect = subtitleOverlay.getBoundingClientRect();
      const maxLeft = Math.max(4, wrapRect.width - ovRect.width - 4);
      const maxTop = Math.max(4, wrapRect.height - ovRect.height - 4);

      const newLeft = Math.min(maxLeft, Math.max(4, dragState.origLeft + dx));
      const newTop = Math.min(maxTop, Math.max(4, dragState.origTop + dy));

      subtitleOverlay.style.left = newLeft + 'px';
      subtitleOverlay.style.top = newTop + 'px';
      subtitleOverlay.style.right = 'auto';
      subtitleOverlay.style.bottom = 'auto';
      subtitleOverlay.style.transform = 'none';

      if (subLayout === 'vertical') {
        videoWrapper.classList.remove('has-vertical-sub');
      }

      if (wrapRect.width > 0 && wrapRect.height > 0) {
        customSubPos[getCurrentPosKey()] = {
          leftRatio: newLeft / wrapRect.width,
          topRatio: newTop / wrapRect.height
        };
      }

      if (e.cancelable) e.preventDefault();
    }

    function endSubDrag() {
      if (!dragState) return;
      const wasMoved = dragState.moved;
      dragState = null;
      videoWrapper.classList.remove('dragging-sub');
      if (wasMoved && isPinned) savePinnedSession();
    }

    subtitleOverlay.addEventListener('touchstart', startSubDrag, { passive: false });
    subtitleOverlay.addEventListener('mousedown', startSubDrag);
    window.addEventListener('touchmove', onSubDragMove, { passive: false });
    window.addEventListener('mousemove', onSubDragMove);
    window.addEventListener('touchend', endSubDrag);
    window.addEventListener('touchcancel', endSubDrag);
    window.addEventListener('mouseup', endSubDrag);
    window.addEventListener('resize', clampOverlayInBounds);

    // --- GHIM PHIÊN XEM ---
    function updatePinBtnUI() {
      if (!currentVideoId) {
        pinBtn.disabled = true;
        pinBtn.className = 'btn-unpinned';
        pinBtn.textContent = '📌 Ghim';
        return;
      }
      pinBtn.disabled = false;
      if (isPinned) {
        pinBtn.className = 'btn-pinned';
        pinBtn.textContent = '📌 Đã ghim';
      } else {
        pinBtn.className = 'btn-unpinned';
        pinBtn.textContent = '📌 Ghim';
      }
    }

    function savePinnedSession(customTime = null) {
      if (!isPinned || !currentVideoId) return;
      try {
        const curSec = customTime !== null
          ? customTime
          : (ytPlayer?.getCurrentTime ? ytPlayer.getCurrentTime() : lastSavedTime);
        lastSavedTime = curSec || 0;

        const payload = {
          videoId: currentVideoId,
          urlInput: document.getElementById('ytUrlInput').value,
          rawTranscriptInput: document.getElementById('rawTranscriptInput').value,
          baseTranscript,
          currentTranscript,
          subLayout,
          showFr,
          showVi,
          subDelay,
          subHold,
          minSubDur,
          timeScale,
          customSubPos,
          lastTime: lastSavedTime
        };
        localStorage.setItem(PIN_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        console.warn('Không thể lưu ghim vào localStorage:', e);
      }
    }

    function clearPinnedSession() {
      isPinned = false;
      lastSavedTime = 0;
      localStorage.removeItem(PIN_STORAGE_KEY);
      updatePinBtnUI();
    }

    pinBtn.addEventListener('click', () => {

      }
    });

    // --- TÁCH ID YOUTUBE & PHÂN TÍCH BẢN CHÉP LỜI ---
    function extractYouTubeId(input) {
      const val = (input || '').trim();
      if (!val) return '';
      if (/^[a-zA-Z0-9_-]{11}$/.test(val)) return val;
      const patterns = [
        /(?:v=|\/v\/|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([a-zA-Z0-9_-]{11})/,
        /[?&]v=([a-zA-Z0-9_-]{11})/
      ];
      for (const re of patterns) {
        const m = val.match(re);
        if (m) return m[1];
      }
      return '';
    }

    function formatClockTime(sec) {
      const total = Math.max(0, Math.floor(sec));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function parseRawPastedTranscript(rawText) {
      const text = (rawText || '').replace(/\r/g, '').trim();
      if (!text) return [];

      // 1. Định dạng JSON mảng
      if (text.startsWith('[')) {
        try {
          const arr = JSON.parse(text);
          if (Array.isArray(arr)) {
            return arr.map(it => {
              const s = Number(it.start) || 0;
              const e = Number(it.end) || (s + 3);
              const fr = (it.fr || it.text || '').trim();
              const vi = (it.vi || '').trim();
              return {
                time: it.time || formatClockTime(s),
                start: s,
                end: e,
                speaker: (it.speaker || '').trim(),
                fr,
                vi
              };
            }).filter(x => x.fr);
          }
        } catch {}
      }

      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

      // 2. Định dạng từng từ theo mili-giây: "start|end|từ"
      if (lines.length && /^\d+(\.\d+)?\|\d+(\.\d+)?\|/.test(lines[0])) {
        const rawWords = [];
        for (const line of lines) {
          const parts = line.split('|');
          if (parts.length < 3) continue;
          const start = Number(parts[0]);
          const end = Number(parts[1]);
          const word = parts.slice(2).join('|').trim();
          if (!word || Number.isNaN(start) || Number.isNaN(end)) continue;
          rawWords.push({ start, end: Math.max(start + 0.05, end), word });
        }
        if (!rawWords.length) return [];

        const blocks = [];
        let bucket = [];

        function flushBucket() {
          if (!bucket.length) return;
          const bStart = bucket[0].start;
          const bEnd = Math.max(bStart + 0.25, bucket[bucket.length - 1].end);
          const phrase = bucket.map(w => w.word).join(' ').replace(/\s+([,.;:!?…»])/g, '$1').replace(/(«)\s+/g, '$1');
          blocks.push({
            time: formatClockTime(bStart),
            start: Number(bStart.toFixed(3)),
            end: Number(bEnd.toFixed(3)),
            speaker: '',
            fr: phrase,
            vi: ''
          });
          bucket = [];
        }

        for (let i = 0; i < rawWords.length; i++) {
          const w = rawWords[i];
          const prev = bucket.length ? bucket[bucket.length - 1] : null;
          const gap = prev ? (w.start - prev.end) : 0;
          const endsSentence = prev && /[.!?…]$/.test(prev.word);
          const endsClause = prev && /[,;:]$/.test(prev.word) && bucket.length >= 5;

          if (bucket.length > 0 && (endsSentence || endsClause || gap > 1.0 || bucket.length >= 10)) {
            flushBucket();
          }
          bucket.push(w);
        }
        flushBucket();
        return blocks;
      }

      // 3. Định dạng phụ đề .SRT
      const srtTimeRe = /^(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{3})/;
      if (lines.some(l => srtTimeRe.test(l))) {
        const result = [];
        let cur = null;
        for (const line of lines) {
          const m = line.match(srtTimeRe);
          if (m) {
            if (cur && cur.fr) result.push(cur);
            const start = Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]) + Number(m[4]) / 1000;
            const end = Number(m[5]) * 3600 + Number(m[6]) * 60 + Number(m[7]) + Number(m[8]) / 1000;
            cur = { time: formatClockTime(start), start: Number(start.toFixed(2)), end: Number(end.toFixed(2)), speaker: '', fr: '', vi: '' };
          } else if (cur && !/^\d+$/.test(line)) {
            const clean = line.replace(/<[^>]+>/g, '').trim();
            cur.fr = cur.fr ? `${cur.fr} ${clean}` : clean;
          }
        }
        if (cur && cur.fr) result.push(cur);
        return result;
      }

      // 4. Định dạng copy trực tiếp từ bản chép lời YouTube ("0:00 ...")
      const ytTimeRe = /^[-•*\s[\](]*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[\])\-\s]*(.*)$/;
      const entries = [];
      let currentEntry = null;

      for (const line of lines) {
        const m = line.match(ytTimeRe);
        if (m) {
          if (currentEntry) entries.push(currentEntry);
          const h = m[1] ? Number(m[1]) : 0;
          const min = Number(m[2]);
          const sec = Number(m[3]);
          const start = h * 3600 + min * 60 + sec;
          currentEntry = {
            time: formatClockTime(start),
            start,
            end: start + 3.5,
            speaker: '',
            fr: (m[4] || '').trim(),
            vi: ''
          };
        } else if (currentEntry) {
          currentEntry.fr = currentEntry.fr ? `${currentEntry.fr} ${line}` : line;
        }
      }
      if (currentEntry) entries.push(currentEntry);

      for (let i = 0; i < entries.length; i++) {
        const naturalDur = Math.max(2.2, Math.ceil(entries[i].fr.length / 13));
        if (i < entries.length - 1 && entries[i + 1].start > entries[i].start) {
          entries[i].end = Math.min(entries[i + 1].start, entries[i].start + naturalDur);
        } else {
          entries[i].end = entries[i].start + naturalDur;
        }
      }
      return entries.filter(x => x.fr);
    }

    // --- KHỞI CHẠY VIDEO LẺ & LÀM MỚI PHIÊN ---
    document.getElementById('playSingleBtn').addEventListener('click', () => {

    // --- CHUYỂN ĐỔI KIỂU PHỤ ĐỀ: NGANG <-> DỌC ---
    function applyLayoutMode() {
      const isVert = subLayout === 'vertical';
      subtitleOverlay.className = isVert
        ? 'subtitle-overlay mode-vertical is-empty'
        : 'subtitle-overlay mode-horizontal';
      videoWrapper.classList.toggle('has-vertical-sub', isVert && !customSubPos.vertical);

      toggleLayoutBtn.textContent = isVert ? '📐 Kiểu PĐ: Dọc' : '📐 Kiểu PĐ: Ngang';
      floatingLayoutBtn.textContent = isVert ? '📐 PĐ: Dọc' : '📐 PĐ: Ngang';

      renderOverlayStructure();
      applySavedOverlayPosition();
      activeIndex = -1;
      renderedPairStart = -1;
      syncSubtitle(true);
      if (isPinned) savePinnedSession();

    function toggleLayoutMode() {
      subLayout = subLayout === 'horizontal' ? 'vertical' : 'horizontal';
      applyLayoutMode();
    }

    toggleLayoutBtn.addEventListener('click', toggleLayoutMode);
    floatingLayoutBtn.addEventListener('click', toggleLayoutMode);

    function renderOverlayStructure() {
      renderedPairStart = -1;
      if (subLayout === 'horizontal') {
        subtitleOverlay.innerHTML = '<div id="subtitleBox" class="subtitle-box"></div>';
        return;
      }

      subtitleOverlay.innerHTML = `
        <div class="v-drag-handle" title="Kéo để di chuyển khung phụ đề (chạm đúp để về góc mặc định)">⋮⋮ Kéo vị trí</div>
        <div class="v-sub-list" id="vSubList"></div>
      `;
      subtitleOverlay.classList.add('is-empty');

    // Dựng HTML cho cặp 2 câu [pairStart, pairStart + 1]
    function buildTwoSentenceHtml(pairStart, highlightedIdx, isVertical) {
      const frCls = isVertical ? 'v-fr' : 'sub-fr';
      const viCls = isVertical ? 'v-vi' : 'sub-vi';
      let html = '';

      for (let offset = 0; offset < 2; offset++) {
        const i = pairStart + offset;
        if (i >= currentTranscript.length) break;
        const item = currentTranscript[i];
        const fr = item.fr || item.text || '';
        const vi = item.vi || '';
        const stateCls = (i === highlightedIdx) ? 'is-active' : 'is-inactive';

        html += `<div class="sub-pair-line ${stateCls}" data-pair-idx="${i}">`;
        if (showFr && fr) {
          html += `<div class="${frCls}">${item.speaker ? `<span class="speaker-badge">${escapeHtml(item.speaker)}</span>` : ''}${escapeHtml(fr)}</div>`;
        }
        if (showVi && vi) {
          const spk = (!showFr && item.speaker) ? `<span class="speaker-badge">${escapeHtml(item.speaker)}</span>` : '';
          html += `<div class="${viCls}">${spk}${escapeHtml(vi)}</div>`;
        }
        html += `</div>`;
      }
      return html;
    }

    // --- BẬT / TẮT PHỤ ĐỀ TỪNG NGÔN NGỮ ---
    const toggleFrBtn = document.getElementById('toggleFrBtn');

    // --- TOÀN MÀN HÌNH ---
    function toggleFullscreen() {
      const nativeFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (nativeFs) {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
        videoWrapper.classList.remove('pseudo-fs');
        requestAnimationFrame(clampOverlayInBounds);
        return;
      }
      if (videoWrapper.classList.contains('pseudo-fs')) {
        videoWrapper.classList.remove('pseudo-fs');
        requestAnimationFrame(clampOverlayInBounds);
        return;
      }

      const reqFs = videoWrapper.requestFullscreen || videoWrapper.webkitRequestFullscreen;
      if (reqFs) {
        try {
          const p = reqFs.call(videoWrapper);
          if (p && typeof p.catch === 'function') {
            p.catch(() => {
              videoWrapper.classList.add('pseudo-fs');
              requestAnimationFrame(clampOverlayInBounds);
            });
          }
        } catch {
          videoWrapper.classList.add('pseudo-fs');
        }
      } else {
        videoWrapper.classList.add('pseudo-fs');
      }
      requestAnimationFrame(clampOverlayInBounds);
    }
    document.getElementById('toggleFsBtn').addEventListener('click', toggleFullscreen);
    document.getElementById('floatingFsBtn').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => requestAnimationFrame(clampOverlayInBounds));
    document.addEventListener('webkitfullscreenchange', () => requestAnimationFrame(clampOverlayInBounds));

    // --- TẠO PROMPT AI & ÁP DỤNG BẢN DỊCH ---
    function populateExportBox(vidId, lines) {
      if (!lines.length) {
        exportBox.value = '';
        return;
      }
      const compactLines = lines.map((line, idx) => ({
        i: idx,
        time: line.time || '',
        start: line.start,
        end: line.end,
        fr: line.fr || line.text || ''
      }));

      exportBox.value =
        `${AI_PROMPT}\n` +
        `Link video: https://www.youtube.com/watch?v=${vidId}\n\n` +
        JSON.stringify(compactLines, null, 2);
    }

    document.getElementById('copyRawBtn').addEventListener('click', async () => {
      if (!exportBox.value) return;
      try {
        await navigator.clipboard.writeText(exportBox.value);
      } catch {
        exportBox.select();
        document.execCommand('copy');
      }
      const btn = document.getElementById('copyRawBtn');
      btn.textContent = '✓ Đã copy!';
      setTimeout(() => btn.textContent = '📋 Copy trọn bộ', 1800);
    });

    document.getElementById('applySubBtn').addEventListener('click', () => {
      if (!baseTranscript.length) {
        alert('Chưa có phụ đề gốc để ghép mốc thời gian!');
        return;
      }
      let rawText = importBox.value.trim();
      if (!rawText) {
        alert('Hãy dán mảng JSON từ AI vào ô bên dưới trước khi bấm Áp dụng!');
        return;
      }
      rawText = rawText.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

      let parsed;
      try {
        parsed = JSON.parse(rawText);
      } catch (err) {
        alert('Dữ liệu dán vào chưa đúng chuẩn JSON:\n' + err.message);
        return;
      }
      if (!Array.isArray(parsed) || !parsed.length) {
        alert('Dữ liệu JSON phải là một danh sách [...] các đoạn phụ đề.');
        return;
      }

      if (typeof parsed[0].from_i === 'number') {
        const maxIdx = baseTranscript.length - 1;
        currentTranscript = parsed.map((row, bIdx) => {
          const fIdx = Math.max(0, Math.min(maxIdx, row.from_i));
          const tIdx = Math.max(fIdx, Math.min(maxIdx, typeof row.to_i === 'number' ? row.to_i : fIdx));
          const firstLine = baseTranscript[fIdx];
          const lastLine = baseTranscript[tIdx];

          let start = firstLine.start;
          let end = lastLine.end;
          const splitAtStart = bIdx > 0 && parsed[bIdx - 1].to_i === fIdx;
          const splitAtEnd = bIdx < parsed.length - 1 && parsed[bIdx + 1].from_i === tIdx;

          if (splitAtStart) start = (firstLine.start + firstLine.end) / 2;
          if (splitAtEnd) end = (lastLine.start + lastLine.end) / 2;

          return {
            time: firstLine.time || '',
            start: Number(start.toFixed(3)),
            end: Number(end.toFixed(3)),
            speaker: (row.speaker || '').trim(),
            fr: (row.fr || '').trim(),
            vi: (row.vi || '').trim()
          };
        });
      } else {
        const byIndex = {};
        parsed.forEach((row, idx) => {
          const key = typeof row.i === 'number' ? row.i : idx;
          byIndex[key] = row;
        });

        currentTranscript = baseTranscript.map((orig, idx) => {
          const aiRow = byIndex[idx];
          if (aiRow) {
            return {
              time: orig.time,
              start: orig.start,
              end: orig.end,
              speaker: (aiRow.speaker || orig.speaker || '').trim(),
              fr: (aiRow.fr || aiRow.text || orig.fr || orig.text || '').trim(),
              vi: (aiRow.vi || '').trim()
            };
          }
          return orig;
        });
      }

      activeIndex = -1;
      renderedPairStart = -1;
      lastActiveIndex = -1;
      renderOverlayStructure();
      applySavedOverlayPosition();
      renderTranscriptList();
      syncSubtitle(true);
      if (isPinned) savePinnedSession();
      statusEl.textContent = `✨ Đã áp dụng ${currentTranscript.length} câu song ngữ (hiển thị 2 câu/lượt, highlight 1 câu).`;
    });

    // --- TRÌNH PHÁT YOUTUBE & ĐỒNG BỘ 2 CÂU / HIGHLIGHT 1 CÂU ---
    function loadYouTubeVideo(videoId, startSec = 0) {
      if (ytPlayer?.loadVideoById) {
        ytPlayer.loadVideoById({ videoId, startSeconds: Math.floor(startSec || 0) });
      } else {
        window.pendingYtId = videoId;
        window.pendingStartSec = Math.floor(startSec || 0);
        if (!document.getElementById('yt-api-script')) {
          const tag = document.createElement('script');
          tag.id = 'yt-api-script';
          tag.src = 'https://www.youtube.com/iframe_api';
          document.head.appendChild(tag);
        }
      }
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('ytPlayer', {
        videoId: window.pendingYtId || '',
        playerVars: {
          playsinline: 1,
          fs: 0,
          rel: 0,
          cc_load_policy: 0,
          start: window.pendingStartSec || 0
        }
      });
    };

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function renderTranscriptList() {
      transcriptBox.innerHTML = '';
      currentTranscript.forEach((item, idx) => {
        const fr = item.fr || item.text || '';
        const vi = item.vi || '';
        const div = document.createElement('div');
        div.className = 'line';
        div.id = 'line-' + idx;
        div.innerHTML = `
          <span class="time">${item.time || item.start.toFixed(1) + 's'}</span>
          <div>
            ${item.speaker ? `<span class="speaker-badge">${escapeHtml(item.speaker)}</span>` : ''}
            <div class="line-fr">${escapeHtml(fr)}</div>
            ${vi ? `<div class="line-vi">${escapeHtml(vi)}</div>` : ''}
          </div>
        `;
        div.onclick = () => seekTo(item.start);
        transcriptBox.appendChild(div);
      });
    }

    function seekTo(seconds) {
      if (ytPlayer?.seekTo) {
        const targetPlayerSec = Math.max(0, (seconds + subDelay) / timeScale);
        ytPlayer.seekTo(targetPlayerSec, true);
        ytPlayer.playVideo();
        if (isPinned) savePinnedSession(targetPlayerSec);
      }
    }

    function updatePairHighlightClasses(container, highlightedIdx) {
      if (!container) return;
      container.querySelectorAll('.sub-pair-line').forEach(el => {
        const lineIdx = Number(el.dataset.pairIdx);
        const active = (lineIdx === highlightedIdx);
        el.classList.toggle('is-active', active);
        el.classList.toggle('is-inactive', !active);
      });
    }

    function syncSubtitle(forceRender = false) {
      if (!currentTranscript.length || !ytPlayer?.getCurrentTime) return;
      const rawTime = ytPlayer.getCurrentTime();

      if (isPinned && Math.abs(rawTime - lastSavedTime) >= 3) {
        savePinnedSession(rawTime);
      }

      // Áp dụng hệ số tốc độ và độ trễ Delay người dùng đã chỉnh
      const effectiveTime = rawTime * timeScale - subDelay;

      // Tìm câu đang khớp thời gian hiện tại (đã tính Giữ thêm + Tối thiểu/câu)
      let idx = -1;
      for (let i = 0; i < currentTranscript.length; i++) {
        const item = currentTranscript[i];
        const effEnd = getEffectiveEnd(i);
        if (effectiveTime >= item.start && effectiveTime <= effEnd) {
          idx = i;
          break;
        }
      }

      if (idx !== -1) {
        lastActiveIndex = idx;
        lastActiveRawEnd = getEffectiveEnd(idx);
      }

      // Xác định cặp 2 câu cần hiển thị: [0,1], [2,3], [4,5]...
      // Nếu đang ở khoảng nghỉ ngắn (< 1.2s) giữa 2 câu, giữ nguyên cặp hiện tại và tắt highlight để không bị nhấp nháy
      let pairStartToRender = -1;
      if (idx !== -1) {
        pairStartToRender = Math.floor(idx / 2) * 2;
      } else if (
        lastActiveIndex !== -1 &&
        effectiveTime > lastActiveRawEnd &&
        effectiveTime <= lastActiveRawEnd + 1.2
      ) {
        pairStartToRender = Math.floor(lastActiveIndex / 2) * 2;
      }

      const activeChanged = idx !== activeIndex || forceRender;
      const pairChanged = pairStartToRender !== renderedPairStart || forceRender;

      if (activeChanged) {
        if (activeIndex !== -1) {
          document.getElementById('line-' + activeIndex)?.classList.remove('active');
        }
        activeIndex = idx;
        if (idx !== -1) {
          const activeLine = document.getElementById('line-' + idx);
          if (activeLine) {
            activeLine.classList.add('active');
            if (!forceRender) activeLine.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      }

      if (subLayout === 'horizontal') {
        const box = document.getElementById('subtitleBox');
        if (!box) return;

        if (pairStartToRender === -1 || (!showFr && !showVi)) {
          if (box.innerHTML !== '') box.innerHTML = '';
          renderedPairStart = -1;
        } else if (pairChanged) {
          renderedPairStart = pairStartToRender;
          box.innerHTML = buildTwoSentenceHtml(pairStartToRender, idx, false);
          if (customSubPos[getCurrentPosKey()]) clampOverlayInBounds();
        } else if (activeChanged) {
          updatePairHighlightClasses(box, idx);
        }
      } else {
        const vSubList = document.getElementById('vSubList');
        if (!vSubList) return;

        if (pairStartToRender === -1 || (!showFr && !showVi)) {
          subtitleOverlay.classList.add('is-empty');
          renderedPairStart = -1;
        } else {
          subtitleOverlay.classList.remove('is-empty');
          if (pairChanged) {
            renderedPairStart = pairStartToRender;
            vSubList.innerHTML = buildTwoSentenceHtml(pairStartToRender, idx, true);
            if (customSubPos[getCurrentPosKey()]) clampOverlayInBounds();
          } else if (activeChanged) {
            updatePairHighlightClasses(vSubList, idx);
          }
        }
      }
    }

    // --- KHÔI PHỤC VIDEO ĐANG GHIM KHI MỞ LẠI TRANG ---
    window.addEventListener('DOMContentLoaded', () => {
      updateTimingUI();
      try {
        const raw = localStorage.getItem(PIN_STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !saved.videoId) return;

        isPinned = true;
        currentVideoId = saved.videoId;
        baseTranscript = Array.isArray(saved.baseTranscript) ? saved.baseTranscript : [];
        currentTranscript = Array.isArray(saved.currentTranscript) ? saved.currentTranscript : [];
        subLayout = saved.subLayout || 'horizontal';
        showFr = saved.showFr !== undefined ? saved.showFr : true;
        showVi = saved.showVi !== undefined ? saved.showVi : true;
        if (typeof saved.subDelay === 'number') subDelay = saved.subDelay;
        if (typeof saved.subHold === 'number') subHold = saved.subHold;
        if (typeof saved.minSubDur === 'number') minSubDur = saved.minSubDur;
        if (typeof saved.timeScale === 'number') timeScale = saved.timeScale;

        if (saved.customSubPos) {
          customSubPos = {
            horizontal: saved.customSubPos.horizontal || null,
            horizontalFs: saved.customSubPos.horizontalFs || null,
            vertical: saved.customSubPos.vertical || null
          };
        }
        lastSavedTime = Number(saved.lastTime) || 0;

        document.getElementById('ytUrlInput').value = saved.urlInput || `https://www.youtube.com/watch?v=${currentVideoId}`;
        document.getElementById('rawTranscriptInput').value = saved.rawTranscriptInput || '';
        document.getElementById('inputDrawer').open = false;

        updateTimingUI();
        updatePinBtnUI();
        updateLangButtonsUI();
        applyLayoutMode();
        renderTranscriptList();
        populateExportBox(currentVideoId, baseTranscript);
        loadYouTubeVideo(currentVideoId, lastSavedTime);

        statusEl.textContent = `📌 Đã khôi phục video đang ghim [${currentVideoId}] (${currentTranscript.length} câu).`;
      } catch (e) {
        console.warn('Lỗi đọc dữ liệu ghim:', e);
      }
    });

    setInterval(syncSubtitle, 60);
  </script>
</body>
